<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Chest Template</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Palatino', 'Palatino Linotype', 'Georgia', serif;
    }

    body {
      background-color: #2c1d11;
      color: #3e2723;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Banner Kompas & Peta */
    .map-banner {
      color: #d4af37;
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* Kartu Peta Tua */
    .treasure-card {
      background-color: #f4e4bc; /* Warna Kertas Peta Tua */
      background-image: radial-gradient(#e0cf9b 15%, transparent 16%);
      background-size: 16px 16px;
      border: 4px solid #8b5a2b;
      border-radius: 12px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      box-shadow: inset 0 0 30px rgba(100, 50, 10, 0.3), 0 10px 25px rgba(0,0,0,0.6);
    }

    /* Badge Kunci Antik */
    .key-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #8b5a2b;
      color: #ffd700;
      border: 1px solid #ffd700;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    /* Animasi Peti Kayu Tua */
    .chest-img {
      width: 150px;
      height: 150px;
      margin: 15px auto;
      display: block;
      cursor: pointer;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
      transition: transform 0.2s ease;
    }

    .chest-img:hover {
      animation: treasure-shake 0.4s infinite;
    }

    @keyframes treasure-shake {
      0% { transform: scale(1.03) rotate(0deg); }
      25% { transform: scale(1.03) rotate(-4deg); }
      50% { transform: scale(1.03) rotate(4deg); }
      75% { transform: scale(1.03) rotate(-2deg); }
      100% { transform: scale(1.03) rotate(0deg); }
    }

    .chest-title {
      font-size: 1.4rem;
      color: #4a2c11;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .chest-desc {
      font-size: 0.85rem;
      color: #6d4c41;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .price-tag {
      font-size: 1.6rem;
      color: #b8860b;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 1px 1px 0px #fff;
    }

    /* Tombol Buka Peti */
    .btn-open {
      background: linear-gradient(180deg, #d4af37, #aa7c11);
      color: #2c1d11;
      border: 2px solid #5c3a1e;
      padding: 12px 20px;
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .btn-open:hover {
      background: linear-gradient(180deg, #ffd700, #c59b27);
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- Info Kompas / Peta -->
  <div class="map-banner">
    <span>🧭 KOORDINAT RAHASIA: X-MARKS THE SPOT</span>
  </div>

  <!-- Kartu Harta Karun -->
  <div class="treasure-card">
    <div class="key-badge">🔑 DIBUTUHKAN KUNCI EMAS</div>

    <!-- Gambar Peti Kayu Tua -->
    <img class="chest-img" src="https://cdn-icons-png.flaticon.com/512/3063/3063822.png" alt="Peti Harta Karun">

    <h3 class="chest-title">PETI KAPITEN BLACKBEARD</h3>
    <p class="chest-desc">Buka peti tua ini dan dapatkan barang berharga senilai jutaan rupiah di dalamnya!</p>

    <div class="price-tag">🪙 50.000 KOIN EMAS</div>

    <button class="btn-open">BUKA PETI SEKARANG 🗝️</button>
  </div>

</body>
</html>
